# Skill badges: earned once across the whole course, for how a learner learned rather than
# what they covered. Each has a rule the site knows (web/src/badges.js):
#   clean-run   every challenge in a branch right on the first pick
#   no-peeking  every module and challenge in a branch passed without the solution
#   flawless    a boss beaten without losing a heart
#   explorer    a module passed in every branch
#   pass        the module named by `module`
# `personas`: who sees it (none: everyone). Essentials has one branch and no solutions, so No
# Peeking, Explorer and Cross-Team are the Developer persona's.
# Tier badges are named in each branch.md, under its tier; boss badges are its classTitle.
- id: clean-run
  name: Clean Run
  icon: bolt
  rule: clean-run
  criteria: Every challenge in a branch right on the first try
- id: no-peeking
  personas: [developer]
  name: No Peeking
  icon: closed-eye
  rule: no-peeking
  criteria: Finish a branch without peeking at the solution
- id: flawless
  name: Flawless
  icon: hearts
  rule: flawless
  criteria: Beat a boss without losing a heart
- id: explorer
  personas: [developer]
  name: Explorer
  icon: compass
  rule: explorer
  criteria: Pass a module in every branch
- id: cross-team
  personas: [developer]
  name: Cross-Team
  icon: link
  rule: pass
  module: N5
  criteria: "Pass N5: a workflow calls another team's agent"
# Essentials' module badges: one for each thing a trip on Temporal survives, earned with its module.
- id: logbook-keeper
  personas: [essentials]
  name: Logbook Keeper
  icon: logbook
  rule: pass
  module: E1
  criteria: Run a trip on Temporal, and read its logbook
- id: fix-forward
  personas: [essentials]
  name: Fix Forward
  icon: wrench
  rule: pass
  module: E2
  criteria: Finish a stuck trip by shipping the fix
- id: storm-rider
  personas: [essentials]
  name: Storm Rider
  icon: umbrella
  rule: pass
  module: E3
  criteria: Ride out the airline's bad minute
- id: night-owl
  personas: [essentials]
  name: Night Owl
  icon: moon
  rule: pass
  module: E4
  criteria: Keep a trip waiting safely while nobody is on shift
- id: crash-proof
  personas: [essentials]
  name: Crash Proof
  icon: plug
  rule: pass
  module: E5
  criteria: Pull the plug mid-trip, and book nothing twice
- id: time-keeper
  personas: [essentials]
  name: Time Keeper
  icon: hourglass
  rule: pass
  module: E6
  criteria: Keep a three-day hold through a crash
- id: signed-off
  personas: [essentials]
  name: Signed Off
  icon: stamp
  rule: pass
  module: E7
  criteria: Wait for the manager's yes, however long it takes
- id: clean-undo
  personas: [essentials]
  name: Clean Undo
  icon: undo
  rule: pass
  module: E8
  criteria: Undo a declined trip cleanly, newest first
