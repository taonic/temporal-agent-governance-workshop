[project]
name = "governed-agents-workshop"
version = "0.1.0"
description = "Governed Agents With Temporal, Monty, And Dogwood"
requires-python = ">=3.11"
dependencies = [
    "temporal-agent-harness[ui,code-mode]",
    "temporalio>=1.31.0",
    "pydantic>=2",
    "openai",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
gpu = [
    "daytona",
]

# Dogwood auto mode (`dogwood_evaluator`) is only on this branch so far. Pinned by commit, so
# every learner gets the same harness; move to the PyPI release once it ships.
[tool.uv.sources]
temporal-agent-harness = { git = "https://github.com/temporal-community/temporal-agent-harness", rev = "15da54ee8e2baff0370ca245e9da1e29ba831ab8" }

[tool.pytest.ini_options]
# The exercise 4 menu tests fail until you write their rules: run them with `-m menu`.
addopts = "-m 'not menu'"
markers = ["menu: exercise 4's optional policy edits"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["travel_agent", "hello", "codemode"]

[tool.ruff]
line-length = 120
extend-exclude = [".dogwood"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["travel_agent", "hello", "codemode", "temporal_agent_harness"]

[tool.ruff.lint.per-file-ignores]
# The starter imports what learners will need for their TODOs.
"starter/**" = ["F401"]
"solutions/**" = ["F401"]
# Runs in the Monty sandbox, where the travel functions are already in scope.
"codemode/trip.py" = ["F821"]

[project.scripts]
hello-worker = "hello.worker:run"
hello-start = "hello.starter:run"
hello-board = "hello.starter:run_board"
travel-worker = "travel_agent.worker:run"
travel-stack = "travel_agent.stack:run"
code-mode = "codemode.run:main"
