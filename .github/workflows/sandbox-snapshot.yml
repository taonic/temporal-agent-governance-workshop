# Builds the learner sandbox snapshot on Daytona, so a course deploy never asks for a snapshot
# that doesn't exist. The snapshot's name is a hash of SNAPSHOT_INPUTS in
# course/runner/repo-files.mjs, and build.mjs does nothing when a snapshot of that name already
# exists, so running it on every deploy costs a few seconds unless the dependencies changed.
#
# Runs as the first job of deploy.yml (every merge to main), or by hand from the Actions tab.
# Needs the repository secret DAYTONA_API_KEY.

name: Sandbox snapshot

on:
  workflow_call:
    inputs:
      force:
        description: Rebuild even if a snapshot with this name exists
        type: boolean
        default: false
    outputs:
      name:
        description: The snapshot's name
        value: ${{ jobs.build.outputs.name }}
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if a snapshot with this name exists
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One build at a time; a second run with the same inputs waits, then finds the snapshot built.
    concurrency:
      group: sandbox-snapshot
      cancel-in-progress: false
    outputs:
      name: ${{ steps.name.outputs.name }}
    defaults:
      run:
        working-directory: course
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: course/package-lock.json

      # build.mjs needs only the Daytona SDK, a runtime dependency.
      - run: npm ci --omit=dev

      - name: Snapshot name
        id: name
        run: echo "name=$(node snapshot/build.mjs --name)" >> "$GITHUB_OUTPUT"

      - name: Build on Daytona
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: node snapshot/build.mjs ${{ inputs.force && '--force' || '' }}

      - name: Summary
        run: echo "Snapshot \`${{ steps.name.outputs.name }}\` is ready on Daytona." >> "$GITHUB_STEP_SUMMARY"
